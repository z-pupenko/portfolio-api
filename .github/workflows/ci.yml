name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci_database
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check app tests alembic

      - name: Run lint checks
        run: python -m ruff check app tests alembic

      - name: Run tests
        run: python -m pytest

  postgres:
    name: PostgreSQL migrations and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: ci_database
      JWT_SECRET_KEY: ci-only-secret-not-used-outside-tests
      RUN_POSTGRES_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply migrations to PostgreSQL
        run: python -m alembic upgrade head

      - name: Test latest migration downgrade and upgrade
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Check models and migrations agree
        run: python -m alembic check

      - name: Test PostgreSQL constraints
        run: python -m pytest tests/test_postgres_integration.py
